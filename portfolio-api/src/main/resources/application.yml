spring:
  application:
    name: portfolio-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never

portfolio:
  allowed-origins: ${ALLOWED_ORIGINS:https://gurindersingh.dev,https://www.gurindersingh.dev}
  notify-to: ${NOTIFY_TO:}
  notify-from: ${NOTIFY_FROM:}
  rate-limit:
    capacity: 3
    window-minutes: 60

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: portfolio-api
    description: Backend for gurindersingh.dev
