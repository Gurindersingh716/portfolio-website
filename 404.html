<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not found · Gurinder Singh</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312151E'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.8' fill='none' stroke='%23E8A33D' stroke-width='1.6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='ui-monospace,monospace' font-size='15' font-weight='700' fill='%23E8A33D'%3Egs%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
  /* Theme is resolved before first paint, exactly as on the main page,
     so arriving here from the site never flashes the other palette. */
  (function () {
    try {
      var t = localStorage.getItem('gs-theme');
      if (t === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  })();
</script>
<style>
:root{
  --bg:#12151E; --surface:#1A1F2B; --surface-2:#212736; --line:#2C3446;
  --text:#C3CAD9; --muted:#828CA3; --heading:#EDF1F7;
  --amber:#E8A33D; --cyan:#5CC8D8; --green:#4ADE80; --wire:#5C6889;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --ring:#E8A33D; --ring-glow:rgba(232,163,61,.22);
}
:root[data-theme="light"]{
  --bg:#F4F1EA; --surface:#FBF9F4; --surface-2:#F0ECE3; --line:#DCD5C7;
  --text:#2A2E38; --muted:#5A6272; --heading:#14171F;
  --amber:#9C5D0C; --cyan:#0B6C7D; --green:#2F6B39; --wire:#847B69;
  --ring:#9C5D0C; --ring-glow:rgba(156,93,12,.2);
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:var(--sans);display:flex;align-items:center;justify-content:center;
  padding:32px 22px;position:relative;overflow-x:hidden;
}
.fx{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;}
.box{position:relative;z-index:1;width:100%;max-width:620px;}
.code{
  font-family:var(--mono);font-weight:700;color:var(--heading);
  font-size:clamp(3.4rem,15vw,7rem);line-height:1;letter-spacing:-.04em;
  margin:0 0 6px;display:flex;gap:.04em;
}
.code span{
  display:inline-block;opacity:0;transform:translateY(18px);
  animation:drop .55s cubic-bezier(.2,.8,.2,1) forwards;
}
.code span:nth-child(2){animation-delay:.09s;}
.code span:nth-child(3){animation-delay:.18s;}
@keyframes drop{to{opacity:1;transform:none;}}
h1{
  font-family:var(--mono);font-size:clamp(1rem,3.4vw,1.32rem);font-weight:600;
  color:var(--heading);margin:0 0 20px;letter-spacing:-.01em;
}
.log{
  font-family:var(--mono);font-size:.78rem;line-height:1.95;color:var(--muted);
  border-left:2px solid var(--line);padding-left:16px;margin:0 0 30px;
}
.log div{opacity:0;animation:fade .4s ease forwards;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.log div:nth-child(1){animation-delay:.5s;}
.log div:nth-child(2){animation-delay:.74s;}
.log div:nth-child(3){animation-delay:.98s;}
.log div:nth-child(4){animation-delay:1.22s;}
@keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
.key{color:var(--amber);} .bad{color:var(--amber);font-weight:700;} .ok{color:var(--green);}
.links{display:flex;gap:12px;flex-wrap:wrap;opacity:0;
  animation:fade .5s ease forwards 1.5s;}
.btn{
  font-family:var(--mono);font-size:.85rem;text-decoration:none;
  padding:11px 20px;border-radius:5px;border:1px solid var(--line);
  color:var(--text);background:var(--surface);transition:border-color .2s ease,transform .2s ease;
}
.btn:hover{border-color:var(--amber);transform:translateY(-2px);}
.btn.primary{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:700;}
:root[data-theme="light"] .btn.primary{color:#FBF9F4;}
a:focus-visible{outline:2px solid var(--ring);outline-offset:3px;border-radius:4px;
  box-shadow:0 0 0 6px var(--ring-glow);}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-delay:0ms !important;}
  .code span,.log div,.links{opacity:1;transform:none;}
  .btn:hover{transform:none;}
  .fx{display:none;}
}
</style>
</head>
<body>

<canvas class="fx" aria-hidden="true"></canvas>

<main class="box">
  <p class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>
  <h1>That route isn't mapped.</h1>

  <div class="log" aria-hidden="true">
    <div><span class="key">GET</span> <span id="p">/</span></div>
    <div><span class="key">resolve</span> cloudflare edge <span class="ok">ok</span></div>
    <div><span class="key">match</span> route table <span class="bad">no match</span></div>
    <div><span class="key">status</span> 404 — nothing to serve</div>
  </div>

  <p class="sr" style="position:absolute;left:-9999px;">
    The page you asked for does not exist. Use the links below to return to the site.
  </p>

  <div class="links">
    <a class="btn primary" href="/">Back to home</a>
    <a class="btn" href="/#projects">Projects</a>
    <a class="btn" href="/#contact">Contact</a>
  </div>
</main>

<script>
(function () {
  'use strict';
  /* Show the path that actually missed, trimmed so a long or hostile
     URL cannot stretch the layout. textContent, never innerHTML. */
  var el = document.getElementById('p');
  if (el) {
    var p = String(location.pathname || '/');
    el.textContent = p.length > 42 ? p.slice(0, 42) + '…' : p;
  }

  if (window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var cv = document.querySelector('.fx');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  if (!ctx) return;

  var w, h, dpr, pts, raf = 0;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.min(40, Math.round((w * h) / 30000));
    pts = [];
    for (var i = 0; i < n; i++) {
      pts.push({ x: Math.random() * w, y: Math.random() * h,
                 vx: (Math.random() - .5) * .16, vy: (Math.random() - .5) * .16,
                 r: .8 + Math.random() * 1.1 });
    }
  }
  function css(n, f) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v || f;
  }
  function frame() {
    raf = requestAnimationFrame(frame);
    if (document.hidden) return;
    ctx.clearRect(0, 0, w, h);
    var i, j, p, q, dx, dy, d2, LINK = 130;
    for (i = 0; i < pts.length; i++) {
      p = pts[i]; p.x += p.vx; p.y += p.vy;
      if (p.x < -20) p.x = w + 20; else if (p.x > w + 20) p.x = -20;
      if (p.y < -20) p.y = h + 20; else if (p.y > h + 20) p.y = -20;
    }
    ctx.strokeStyle = css('--wire', '#5C6889'); ctx.lineWidth = .6;
    for (i = 0; i < pts.length; i++) {
      p = pts[i];
      for (j = i + 1; j < pts.length; j++) {
        q = pts[j]; dx = p.x - q.x; dy = p.y - q.y; d2 = dx * dx + dy * dy;
        if (d2 > LINK * LINK) continue;
        ctx.globalAlpha = (1 - Math.sqrt(d2) / LINK) * .24;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
    }
    ctx.globalAlpha = .4; ctx.fillStyle = css('--amber', '#E8A33D');
    for (i = 0; i < pts.length; i++) {
      p = pts[i]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  var t = null;
  window.addEventListener('resize', function () {
    clearTimeout(t); t = setTimeout(size, 160);
  });
  size(); frame();
})();
</script>

</body>
</html>
